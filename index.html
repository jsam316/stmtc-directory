        const { useState, useEffect, useMemo, useRef } = React;

        // 🔐 ENCRYPTED GITHUB TOKEN CONFIGURATION 🔐
        // Token is encrypted with admin PIN for maximum security
        // Regular users CANNOT decrypt this (requires admin PIN)
        const ENCRYPTED_GITHUB_TOKEN = 'eX4JQeoao/O4z7WJhuKHS0DWqjyQtkGgsGBmDtYYCHdrtUT5wkH5DoJ/f3klQI5jIxmn3AMzVNvY8BUosu3qg4cOSr1wNY2fbTD/pd1anlZJToKio26QnjIjW99GE3rUmhuxS6mhJbvaai9zUwI9eVgc2mbo0wOu6EMxVvksZLfJT9dRWfsTDN2q1A==';
        const GITHUB_REPO = 'jsam316/stmtc-directory';
        const GITHUB_BRANCH = 'main';
        const GITHUB_FILE_PATH = 'data/families.json.enc';
        
        // Security Model:
        // - Token encrypted with AES-256-GCM using admin PIN
        // - Only admins with correct PIN can decrypt token
        // - Regular users with directory password CANNOT access GitHub
        // - Perfect privilege separation: View vs Edit
        
        // Base64 <-> bytes without spreading the whole buffer into one call.
        // `String.fromCharCode(...bytes)` throws RangeError past ~100KB of arguments, and
        // the directory JSON is already ~600KB, so the spread form broke every encrypt()
        // once the payload grew — silently, because the sync `try` swallowed it.
        function bytesToBase64(bytes) {
            let binary = '';
            const CHUNK = 0x8000;
            for (let i = 0; i < bytes.length; i += CHUNK) {
                binary += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
            }
            return btoa(binary);
        }
        function base64ToBytes(base64) {
            const binary = atob(base64);
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes;
        }

        // ENCRYPTION
        class DirectoryCrypto {
            constructor() {
                this.algorithm = 'AES-GCM';
                this.keyLength = 256;
                this.iterations = 100000;
            }
            async deriveKey(password, salt) {
                const encoder = new TextEncoder();
                const passwordKey = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveBits', 'deriveKey']);
                return await crypto.subtle.deriveKey({name: 'PBKDF2', salt: salt, iterations: this.iterations, hash: 'SHA-256'}, passwordKey, {name: this.algorithm, length: this.keyLength}, false, ['encrypt', 'decrypt']);
            }
            async encrypt(data, password) {
                const encoder = new TextEncoder();
                const salt = crypto.getRandomValues(new Uint8Array(16));
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const key = await this.deriveKey(password, salt);
                const encrypted = await crypto.subtle.encrypt({name: this.algorithm, iv: iv}, key, encoder.encode(JSON.stringify(data)));
                const combined = new Uint8Array(salt.byteLength + iv.byteLength + encrypted.byteLength);
                combined.set(salt, 0);
                combined.set(iv, salt.byteLength);
                combined.set(new Uint8Array(encrypted), salt.byteLength + iv.byteLength);
                return bytesToBase64(combined);
            }
            // Raw plaintext; use this for values that were not JSON-encoded when encrypted.
            async decryptText(encryptedBase64, password) {
                try {
                    const combined = base64ToBytes(encryptedBase64);
                    const salt = combined.slice(0, 16);
                    const iv = combined.slice(16, 28);
                    const encrypted = combined.slice(28);
                    const key = await this.deriveKey(password, salt);
                    const decrypted = await crypto.subtle.decrypt({name: this.algorithm, iv: iv}, key, encrypted);
                    return new TextDecoder().decode(decrypted);
                } catch (error) {
                    throw new Error('Incorrect password or corrupted data');
                }
            }
            async decrypt(encryptedBase64, password) {
                const text = await this.decryptText(encryptedBase64, password);
                try {
                    return JSON.parse(text);
                } catch (error) {
                    throw new Error('Incorrect password or corrupted data');
                }
            }
            // The embedded GitHub token was encrypted as a bare string rather than a JSON
            // value, so decrypt()'s JSON.parse rejected it and auto-sync silently never
            // engaged. Accept either encoding.
            async decryptToken(encryptedBase64, password) {
                const text = await this.decryptText(encryptedBase64, password);
                try {
                    const parsed = JSON.parse(text);
                    if (typeof parsed === 'string') return parsed;
                } catch (error) {}
                return text.trim();
            }
            async loadEncryptedFile() {
                const paths = ['data/families.json.enc', './data/families.json.enc', 'families.json.enc', './families.json.enc'];
                for (const path of paths) {
                    try {
                        const response = await fetch(path);
                        if (response.ok) return await response.text();
                    } catch (error) {}
                }
                throw new Error('FILE_NOT_FOUND');
            }
        }
        const directoryCrypto = new DirectoryCrypto();

        // PHOTO ENCRYPTION
        // Photos live as individual files, photos/<key>.enc, so they stay out of the
        // families JSON (which otherwise bloats the cache, the unlock decrypt and every
        // sync). GitHub Pages serves the repo publicly, so each file is encrypted with the
        // directory PIN — the same trust boundary as families.json.enc.
        //
        // Unlike DirectoryCrypto, the AES key is derived ONCE per session and reused:
        // PBKDF2 at 100k iterations costs ~100-300ms, fine for one JSON file but minutes
        // for a grid of hundreds of photos. A fixed salt is acceptable here — brute-force
        // resistance is bounded by the PIN's entropy either way — and every file still
        // gets its own random IV.
        // File format: base64( iv[12] ‖ AES-GCM( utf8(data-URL) ) )
        const PHOTO_KEY_SALT = 'stmtc-directory-photos-v1';
        class PhotoCrypto {
            constructor() { this.key = null; this.password = null; this.waiters = []; }
            async init(password) {
                if (!password || (this.key && this.password === password)) return;
                const encoder = new TextEncoder();
                const base = await crypto.subtle.importKey('raw', encoder.encode(password), 'PBKDF2', false, ['deriveKey']);
                this.key = await crypto.subtle.deriveKey(
                    { name: 'PBKDF2', salt: encoder.encode(PHOTO_KEY_SALT), iterations: 100000, hash: 'SHA-256' },
                    base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
                this.password = password;
                const waiting = this.waiters;
                this.waiters = [];
                waiting.forEach(resolve => resolve());
            }
            ready() { return !!this.key; }
            // Key derivation runs asynchronously right after unlock, while the first cards
            // are already asking for photos; callers wait here rather than giving up.
            whenReady() { return this.key ? Promise.resolve() : new Promise(resolve => this.waiters.push(resolve)); }
            async encrypt(dataUrl) {
                if (!this.key) throw new Error('Photo key not initialised');
                const iv = crypto.getRandomValues(new Uint8Array(12));
                const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, this.key, new TextEncoder().encode(dataUrl));
                const out = new Uint8Array(12 + ct.byteLength);
                out.set(iv, 0);
                out.set(new Uint8Array(ct), 12);
                return bytesToBase64(out);
            }
            async decrypt(base64) {
                if (!this.key) throw new Error('Photo key not initialised');
                const bytes = base64ToBytes(base64);
                const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.subarray(0, 12) }, this.key, bytes.subarray(12));
                return new TextDecoder().decode(pt);
            }
        }
        const photoCrypto = new PhotoCrypto();

        // IndexedDB key/value cache. Replaces localStorage for the families cache and holds
        // decrypted photos: its quota is hundreds of MB rather than ~5MB.
        class IdbCache {
            constructor() { this.dbPromise = null; }
            open() {
                if (!this.dbPromise) {
                    this.dbPromise = new Promise((resolve, reject) => {
                        try {
                            const req = indexedDB.open('stmtc-directory', 1);
                            req.onupgradeneeded = () => req.result.createObjectStore('kv');
                            req.onsuccess = () => resolve(req.result);
                            req.onerror = () => reject(req.error);
                        } catch (e) { reject(e); }
                    });
                    this.dbPromise.catch(() => { this.dbPromise = null; });
                }
                return this.dbPromise;
            }
            async run(mode, op) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('kv', mode);
                    const req = op(tx.objectStore('kv'));
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => reject(req.error);
                });
            }
            get(key) { return this.run('readonly', s => s.get(key)); }
            set(key, value) { return this.run('readwrite', s => s.put(value, key)); }
            del(key) { return this.run('readwrite', s => s.delete(key)); }
        }
        const idbCache = new IdbCache();

        // PDF.js worker
        if (window.pdfjsLib) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        }

        // GITHUB SYNC
        class GitHubSync {
            constructor() {
                this.token = null;
                this.repo = GITHUB_REPO;
                this.branch = GITHUB_BRANCH;
                this.filePath = GITHUB_FILE_PATH;
                this.loadConfig();
            }
            // A token saved through the settings dialog. Blank fields never override the
            // built-in repository/branch/path: an empty repository saved here used to
            // disable sync on every reload with no message at all.
            loadConfig() {
                try {
                    const config = localStorage.getItem('githubSyncConfig');
                    if (config) {
                        const parsed = JSON.parse(config);
                        if (parsed.token) { this.token = parsed.token; this.tokenSource = 'saved'; }
                        if (parsed.repo) this.repo = parsed.repo;
                        if (parsed.branch) this.branch = parsed.branch;
                        if (parsed.filePath) this.filePath = parsed.filePath;
                    }
                } catch (error) { console.error('Failed to load GitHub config:', error); }
            }
            hasSavedConfig() {
                try { return !!localStorage.getItem('githubSyncConfig'); } catch (e) { return false; }
            }
            saveConfig(token, repo, branch = GITHUB_BRANCH, filePath = GITHUB_FILE_PATH) {
                token = (token || '').trim();
                repo = (repo || '').trim() || GITHUB_REPO;
                if (!token) throw new Error('Enter a token');
                if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) throw new Error('Repository must look like owner/name');
                this.token = token;
                this.tokenSource = 'saved';
                this.repo = repo;
                this.branch = branch;
                this.filePath = filePath;
                localStorage.setItem('githubSyncConfig', JSON.stringify({ token, repo, branch, filePath }));
                return true;
            }
            clearSavedConfig() {
                try { localStorage.removeItem('githubSyncConfig'); } catch (e) {}
                this.token = null;
                this.tokenSource = null;
                this.repo = GITHUB_REPO;
                this.branch = GITHUB_BRANCH;
                this.filePath = GITHUB_FILE_PATH;
            }
            setDecryptedToken(token) {
                // Called after admin logs in with PIN
                this.token = token;
                this.tokenSource = 'built-in';
                console.log('✅ GitHub token decrypted and ready');
            }
            isConfigured() { return !!(this.token && this.repo); }
            // Why isConfigured() is false, in words the admin can act on.
            unconfiguredReason() {
                if (!this.token) return 'no GitHub token';
                if (!this.repo) return 'no repository set';
                return null;
            }
            // Confirms the token can see the repository and whether it can WRITE to it.
            // The repository's `permissions` field reflects the signed-in user's rights,
            // not a fine-grained token's grants (it read push:true for a token that then
            // got 403 on every upload), so the write check is a real one: creating a Git
            // blob needs "Contents: write" and has no visible effect — no commit, no file,
            // and the orphan object is garbage-collected.
            async checkAccess() {
                if (!this.isConfigured()) throw new Error('GitHub not configured (' + this.unconfiguredReason() + ')');
                const repoRes = await fetch(`https://api.github.com/repos/${this.repo}`, { headers: this.headers() });
                if (!repoRes.ok) throw new Error(repoRes.status === 401 ? 'Invalid token' : (repoRes.status === 404 ? 'Repository not found (or token has no access to it)' : `HTTP ${repoRes.status}`));
                const fullName = (await repoRes.json()).full_name;
                const probe = await fetch(`https://api.github.com/repos/${this.repo}/git/blobs`, {
                    method: 'POST',
                    headers: this.headers({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify({ content: 'write-permission probe', encoding: 'utf-8' })
                });
                let reason = null;
                if (!probe.ok) reason = (await probe.json().catch(() => ({}))).message || `HTTP ${probe.status}`;
                return { fullName, canWrite: probe.ok, reason };
            }
            async testConnection() {
                if (!this.isConfigured()) throw new Error('GitHub not configured');
                const response = await fetch(`https://api.github.com/repos/${this.repo}`, {
                    headers: { 'Authorization': `token ${this.token}`, 'Accept': 'application/vnd.github.v3+json' }
                });
                if (!response.ok) throw new Error(response.status === 401 ? 'Invalid token' : 'Repository not found');
                return await response.json();
            }
            headers(extra = {}) {
                return { 'Authorization': `token ${this.token}`, 'Accept': 'application/vnd.github.v3+json', ...extra };
            }
            // Current blob sha of a file, or null if it does not exist. Never served from
            // the browser cache: the API allows 60s of caching, and a save made within a
            // minute of the previous one was sent with the old sha and rejected by GitHub
            // ("<path> does not match <sha>"), or with no sha at all for a file that had
            // just been created.
            async getFileSHA(path = this.filePath) {
                try {
                    const response = await fetch(`https://api.github.com/repos/${this.repo}/contents/${path}?ref=${this.branch}&t=${Date.now()}`, { headers: this.headers(), cache: 'no-store' });
                    if (response.ok) return (await response.json()).sha;
                    return null;
                } catch (error) { return null; }
            }
            isShaConflict(status, message) {
                return status === 409 || status === 422 && /sha/i.test(message || '');
            }
            // Create or update one file; `textContent` is written verbatim as the file body.
            // A sha conflict (someone or something else wrote the file first, or the sha
            // lookup was stale) is retried once with a freshly fetched sha.
            async uploadFile(path, textContent, commitMessage) {
                if (!this.isConfigured()) throw new Error('GitHub not configured');
                const content = btoa(textContent);
                for (let attempt = 0; attempt < 2; attempt++) {
                    const sha = await this.getFileSHA(path);
                    const body = { message: commitMessage, content, branch: this.branch };
                    if (sha) body.sha = sha;
                    const response = await fetch(`https://api.github.com/repos/${this.repo}/contents/${path}`, {
                        method: 'PUT',
                        headers: this.headers({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify(body)
                    });
                    if (response.ok) return await response.json();
                    const error = await response.json().catch(() => ({}));
                    if (attempt === 0 && this.isShaConflict(response.status, error.message)) {
                        console.warn(`Sha conflict on ${path}, retrying with a fresh sha:`, error.message);
                        continue;
                    }
                    throw new Error(error.message || `Upload failed (HTTP ${response.status})`);
                }
            }
            async deleteFile(path, commitMessage) {
                if (!this.isConfigured()) throw new Error('GitHub not configured');
                for (let attempt = 0; attempt < 2; attempt++) {
                    const sha = await this.getFileSHA(path);
                    if (!sha) return null; // already gone
                    const response = await fetch(`https://api.github.com/repos/${this.repo}/contents/${path}`, {
                        method: 'DELETE',
                        headers: this.headers({ 'Content-Type': 'application/json' }),
                        body: JSON.stringify({ message: commitMessage, sha, branch: this.branch })
                    });
                    if (response.ok) return await response.json();
                    const error = await response.json().catch(() => ({}));
                    if (attempt === 0 && this.isShaConflict(response.status, error.message)) continue;
                    throw new Error(error.message || `Delete failed (HTTP ${response.status})`);
                }
            }
            async uploadData(encryptedData, commitMessage = null) {
                if (!commitMessage) {
                    const now = new Date();
                    commitMessage = `Updated directory - ${now.toLocaleDateString()} ${now.toLocaleTimeString()}`;
                }
                return this.uploadFile(this.filePath, encryptedData, commitMessage);
            }
        }
        const githubSync = new GitHubSync();

        // PHOTO STORE — fetch, decrypt and cache photos/<key>.enc; upload new ones.
        function photoKeyFor(family) {
            const fromNo = String(family.familyNo || '').trim().replace(/[^A-Za-z0-9_-]/g, '_');
            if (fromNo) return fromNo;
            // Blank familyNo: mint a random key; it is persisted on the record.
            const rnd = crypto.getRandomValues(new Uint32Array(2));
            return 'f' + rnd[0].toString(16) + rnd[1].toString(16);
        }
        function hasPhoto(family) {
            return !!(family && (family.photo || family.photoKey || family._pendingPhoto));
        }
        class PhotoStore {
            constructor() { this.memory = new Map(); this.pending = new Map(); }
            path(key) { return `photos/${key}.enc`; }
            cacheId(key, version) { return `${key}@${version || 0}`; }
            peek(key, version) { return key ? (this.memory.get(this.cacheId(key, version)) || null) : null; }
            remember(key, version, dataUrl) {
                const id = this.cacheId(key, version);
                this.memory.set(id, dataUrl);
                idbCache.set('photo:' + id, dataUrl).catch(() => {});
            }
            forget(key) {
                for (const id of [...this.memory.keys()]) if (id.startsWith(key + '@')) this.memory.delete(id);
            }
            // Resolves to a data URL, or null if the file is missing or undecryptable.
            // Concurrent callers for the same photo share one in-flight request.
            load(key, version) {
                if (!key) return Promise.resolve(null);
                const id = this.cacheId(key, version);
                if (this.memory.has(id)) return Promise.resolve(this.memory.get(id));
                if (this.pending.has(id)) return this.pending.get(id);
                const task = (async () => {
                    try {
                        const cached = await idbCache.get('photo:' + id).catch(() => null);
                        if (cached) { this.memory.set(id, cached); return cached; }
                        await photoCrypto.whenReady();
                        // `v` is ignored by the static host; it only busts the browser cache
                        // after a photo is replaced.
                        const res = await fetch(`${this.path(key)}?v=${version || 0}`);
                        if (!res.ok) return null;
                        const dataUrl = await photoCrypto.decrypt((await res.text()).trim());
                        this.remember(key, version, dataUrl);
                        return dataUrl;
                    } catch (error) {
                        console.warn('Photo load failed for', key, error);
                        return null;
                    } finally {
                        this.pending.delete(id);
                    }
                })();
                this.pending.set(id, task);
                return task;
            }
            async upload(key, version, dataUrl) {
                const encrypted = await photoCrypto.encrypt(dataUrl);
                await githubSync.uploadFile(this.path(key), encrypted, `Update photo ${key}`);
                this.forget(key);
                this.remember(key, version, dataUrl);
            }
            async remove(key) {
                this.forget(key);
                await githubSync.deleteFile(this.path(key), `Remove photo ${key}`);
            }
        }
        const photoStore = new PhotoStore();

        // PIN MANAGER
        class PinManager {
            constructor() { this.defaultPin = '753159'; }
            getPin() { return localStorage.getItem('adminPin') || this.defaultPin; }
            setPin(newPin) { localStorage.setItem('adminPin', newPin); }
            verifyPin(pin) { return pin === this.getPin(); }
        }
        const pinManager = new PinManager();

        // HELPERS
        function downloadFile(content, filename, mimeType = 'text/plain') {
            try {
                const blob = new Blob([content], {type: mimeType});
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                URL.revokeObjectURL(url);
                return true;
            } catch (error) {
                console.error('Download failed:', error);
                return false;
            }
        }

        // The local cache is only a CACHE — the encrypted file on GitHub is the source of
        // truth (see loadEncryptedFile) — so a failed write must never abort a save, or the
        // GitHub sync that follows would be skipped and the change lost.
        // IndexedDB is tried first (quota in the hundreds of MB); localStorage (~5MB) is the
        // fallback for browsers that block IndexedDB. Resolves to whether any write succeeded.
        const CACHE_KEY = 'churchDirectory';
        async function saveLocalCache(families) {
            try {
                await idbCache.set(CACHE_KEY, families);
                try { localStorage.removeItem(CACHE_KEY); } catch (e) {} // release the old quota
                return true;
            } catch (idbError) {
                console.warn('IndexedDB cache write failed, trying localStorage:', idbError);
                try {
                    localStorage.setItem(CACHE_KEY, JSON.stringify(families));
                    return true;
                } catch (lsError) {
                    console.warn('Local cache write failed (storage quota likely exceeded):', lsError);
                    return false;
                }
            }
        }
        // IndexedDB first, then the legacy localStorage entry (migrated forward on the next
        // save). Resolves to an array or null.
        async function loadLocalCache() {
            try {
                const fromIdb = await idbCache.get(CACHE_KEY);
                if (Array.isArray(fromIdb)) return fromIdb;
            } catch (e) {}
            try {
                const legacy = localStorage.getItem(CACHE_KEY);
                if (legacy) return JSON.parse(legacy);
            } catch (e) {}
            return null;
        }

        // Status text covering every combination of cache write / GitHub publish, so a
        // silent partial failure can't look like a clean save.
        function describeSaveResult(cached, published, githubAttempted) {
            if (published) return cached ? '✅ Saved and published!' : '✅ Published to GitHub (local cache full)';
            if (githubAttempted) return cached ? '⚠️ Saved locally (GitHub sync failed)' : '⚠️ NOT saved — sync failed and cache is full';
            return cached ? '✅ Saved locally!' : '⚠️ NOT saved — local storage is full';
        }

        function exportToPDF(families) {
            try {
                const doc = new jsPDF();
                let yPos = 20;
                const pageHeight = doc.internal.pageSize.height;
                const margin = 20;
                doc.setFontSize(18);
                doc.setFont(undefined, 'bold');
                doc.text('St Thomas MTC Salmiya, Kuwait', margin, yPos);
                yPos += 10;
                doc.setFontSize(14);
                doc.text('Church Directory', margin, yPos);
                yPos += 10;
                const sortedFamilies = [...families].sort((a, b) => (a.familyNo || '').localeCompare(b.familyNo || ''));
                sortedFamilies.forEach((family) => {
                    if (yPos > pageHeight - 40) { doc.addPage(); yPos = 20; }
                    doc.setFontSize(12);
                    doc.setFont(undefined, 'bold');
                    doc.text(`#${family.familyNo} - ${family.headOfFamily}`, margin, yPos);
                    yPos += 6;
                    doc.setFontSize(10);
                    doc.setFont(undefined, 'normal');

        function resizeImage(file, maxWidth = 320, maxHeight = 320) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        // 320px @ q0.75 — photos never render above 128px (256px at 2x DPI), so
                    // this is visually identical while cutting stored size by roughly half.
                    resolve(canvas.toDataURL('image/jpeg', 0.75));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function resizeImageFromDataUrl(dataUrl, maxWidth = 320, maxHeight = 320) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height;
                    if (width > height) {
                        if (width > maxWidth) { height = Math.round(height * maxWidth / width); width = maxWidth; }
                    } else {
                        if (height > maxHeight) { width = Math.round(width * maxHeight / height); height = maxHeight; }
                    }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    // 320px @ q0.75 — photos never render above 128px (256px at 2x DPI), so
                    // this is visually identical while cutting stored size by roughly half.
                    resolve(canvas.toDataURL('image/jpeg', 0.75));
                };
                img.onerror = reject;
                img.src = dataUrl;
            });
        }

        // Becomes true once the element scrolls near the viewport, and stays true.
        function useInView(ref) {
            const [inView, setInView] = useState(false);
            useEffect(() => {
                if (inView || !ref.current) return;
                if (!('IntersectionObserver' in window)) { setInView(true); return; }
                const observer = new IntersectionObserver((entries) => {
                    if (entries.some(e => e.isIntersecting)) { setInView(true); observer.disconnect(); }
                }, { rootMargin: '200px' });
                observer.observe(ref.current);
                return () => observer.disconnect();
            }, [ref, inView]);
            return inView;
        }

        // Resolves a family's photo to a data URL: an unsaved upload first, then a legacy
        // inline photo, then the encrypted file (fetched lazily once `active`).
        function usePhoto(family, active) {
            const inline = family._pendingPhoto || family.photo || null;
            const key = family.photoKey, version = family.photoUpdated;
            const [src, setSrc] = useState(() => inline || photoStore.peek(key, version));
            useEffect(() => {
                if (inline) { setSrc(inline); return; }
                if (!key) { setSrc(null); return; }
                const cached = photoStore.peek(key, version);
                if (cached) { setSrc(cached); return; }
                setSrc(null);
                if (!active) return;
                let alive = true;
                photoStore.load(key, version).then(url => { if (alive) setSrc(url); });
                return () => { alive = false; };
            }, [inline, key, version, active]);
            return src;
        }

        // Family photo with lazy loading. Shows `fallback` in a placeholder until there is
        // something to render.
        function FamilyPhoto({ family, className, placeholderClassName, fallback, alt }) {
            const ref = useRef(null);
            const visible = useInView(ref);
            const src = usePhoto(family, visible);
            if (src) return <img ref={ref} src={src} alt={alt || family.headOfFamily || ''} className={className} />;
            return <div ref={ref} className={placeholderClassName}>{fallback}</div>;
        }

        // MAIN APP
        function ChurchDirectory() {
            const [isUnlocked, setIsUnlocked] = useState(false);

            useEffect(() => {

            // Derive the photo key once per PIN so cards can decrypt photos on demand.
            useEffect(() => {

            }, [password]);

            // Commit a new families array: update state, write the local cache, sync to
            // GitHub. The sync runs regardless of the cache result — GitHub is the source of
            // truth, so a full cache must never stop the change being saved. Returns the
            // outcome so callers can word their status line.
            const persistFamilies = async (updated, commitMessage) => {
                setFamilies(updated);
                const cached = await saveLocalCache(updated);
                const attempted = githubSync.isConfigured() && !!password;
                let published = false, syncError = null;
                if (attempted) {
                    try {
                        setSyncStatus('☁️ Syncing to GitHub...');
                        const encrypted = await directoryCrypto.encrypt(updated, password);
                        await githubSync.uploadData(encrypted, commitMessage);
                        published = true;
                    } catch (error) {
                        console.error('GitHub sync error:', error);
                        syncError = error.message || String(error);
                    }
                }
                if (!cached && !published) {
                    alert('⚠️ NOT saved!\n\nThe local cache is full and GitHub sync is unavailable, so this change has not been stored.\n\nUse Export → Encrypted Backup to save your work before reloading.');
                }
                // Surface GitHub's own message (e.g. a token permission problem) rather than
                // a generic "sync failed" that gives the admin nothing to act on — and when
                // sync was not even attempted, say why, so "Saved locally" is never mistaken
                // for a successful publish.
                let text = describeSaveResult(cached, published, attempted);
                if (syncError) text += ` — ${syncError}`;
                else if (!attempted && isAdmin) text += ` — GitHub sync off: ${githubSync.unconfiguredReason() || 'directory PIN missing'}`;
                githubSync.lastSync = { at: new Date(), ok: published, attempted, message: syncError || (attempted ? 'ok' : 'not attempted') };
                return { cached, published, attempted, text };
            };

            // Store a photo for a family. With GitHub sync available the photo goes to its own
            // encrypted file and the record keeps only a key; otherwise (local-only mode, or an
            // upload failure) it is kept inline so nothing is lost. Returns the updated record
            // and which of those happened.
            const attachPhoto = async (family, dataUrl) => {
                const fam = { ...family };
                if (githubSync.isConfigured() && password) {
                    const key = fam.photoKey || photoKeyFor(fam);
                    const version = Date.now();
                    try {
                        await photoCrypto.init(password);
                        await photoStore.upload(key, version, dataUrl);
                        fam.photoKey = key;
                        fam.photoUpdated = version;
                        delete fam.photo;
                        return { family: fam, mode: 'file' };
                    } catch (error) {
                        console.error('Photo upload failed for', key, error);
                        fam.photo = dataUrl;
                        return { family: fam, mode: 'fallback', error: error.message || String(error) };
                    }
                }
                fam.photo = dataUrl;
                return { family: fam, mode: 'inline' };
            };
            const describePhotoModes = (modes) => {
                const n = m => modes.filter(x => x === m).length;
                const parts = [];
                if (n('file')) parts.push(`${n('file')} to encrypted file(s)`);
                if (n('inline')) parts.push(`${n('inline')} inline (GitHub sync off)`);
                if (n('fallback')) parts.push(`${n('fallback')} inline (upload failed)`);
                return parts.join(', ');
            };

            // One-time move of legacy inline photos into encrypted files, so the families
            // JSON shrinks back to text. Safe to re-run: records without an inline photo are
            // skipped, and a record only loses its inline copy once its file upload succeeded.
            const inlinePhotoCount = useMemo(() => families.filter(f => f.photo).length, [families]);
            const migratePhotosToFiles = async () => {
                if (!githubSync.isConfigured() || !password) { alert('GitHub sync must be available (log in as admin) to migrate photos.'); return; }
                const todo = families.map((f, i) => f.photo ? i : -1).filter(i => i >= 0);
                if (todo.length === 0) { alert('No inline photos to migrate.'); return; }
                if (!confirm(`Move ${todo.length} photo(s) into encrypted files?\n\nEach photo becomes one commit; this may take a minute.`)) return;
                const updated = [...families];
                let moved = 0, failed = 0, firstError = null;
                for (let n = 0; n < todo.length; n++) {
                    const i = todo[n];
                    setSyncStatus(`📦 Migrating photo ${n + 1} of ${todo.length}...`);
                    const { family, mode, error } = await attachPhoto(updated[i], updated[i].photo);
                    if (mode === 'file') { updated[i] = family; moved++; } else { failed++; if (!firstError) firstError = `#${updated[i].familyNo}: ${error || mode}`; }
                }
                // Nothing moved: keep the JSON as it is rather than publishing a no-op commit.
                if (moved === 0) {
                    setSyncStatus(`📦 No photos migrated — ${failed} failed (${firstError})`);
                    setTimeout(() => setSyncStatus(''), 8000);
                    return;
                }
                const result = await persistFamilies(updated, `Migrate ${moved} photos to encrypted files`);
                setSyncStatus(`📦 Migrated ${moved} photo(s)${failed ? `, ${failed} failed (${firstError})` : ''} — ${result.text}`);
                setTimeout(() => setSyncStatus(''), 6000);
                setShowSettings(false);
            };

            const handleUnlock = async () => {
                if (!passwordInput) { alert('Please enter your Directory PIN'); return; }
                setLoadingData(true);
                setSyncStatus('🔓 Unlocking...');
                try {
                    const encryptedData = await directoryCrypto.loadEncryptedFile();
                    setSyncStatus('🔑 Decrypting...');
                    const decryptedFamilies = await directoryCrypto.decrypt(encryptedData, passwordInput);
                    setFamilies(decryptedFamilies);
                    setPassword(passwordInput);
                    setIsUnlocked(true);
                    saveLocalCache(decryptedFamilies);
                    try { localStorage.setItem('directoryPassword', passwordInput); } catch (e) {}
                    setSyncStatus('✅ Loaded ' + decryptedFamilies.length + ' families!');
                    setTimeout(() => setSyncStatus(''), 3000);

                            setIsUnlocked(true);

            const handleAdminLogin = async () => {

                    setShowAdminLogin(false);
                    setAdminPin('');
                    
                    // Decrypt the embedded GitHub token. The login gate is the admin PIN in
                    // use on this browser; the token itself was encrypted with the default
                    // PIN, so try the current PIN first and then the default. Falling back
                    // weakens nothing — the encrypted token and the default PIN are both in
                    // the public source — and it means changing the admin PIN no longer
                    // disables sync.
                    // A token saved through the 🔄 dialog is an explicit choice, so it wins;
                    // otherwise decrypt the built-in one. (Signing out clears the in-memory
                    // token, so the saved one is reloaded here, not only on page load.)
                    githubSync.loadConfig();
                    if (!githubSync.token) {
                        setSyncStatus('🔐 Decrypting GitHub credentials...');
                        const candidates = [...new Set([pinManager.getPin(), pinManager.defaultPin])];
                        for (const pin of candidates) {
                            try { githubSync.setDecryptedToken(await directoryCrypto.decryptToken(ENCRYPTED_GITHUB_TOKEN, pin)); break; }
                            catch (error) { /* try the next candidate */ }
                        }
                        if (!githubSync.token) console.error('Token decryption failed with the current and default admin PINs');
                    }
                    if (githubSync.isConfigured()) {
                        setSyncStatus(`✅ Admin access granted - GitHub sync ready (${githubSync.tokenSource} token → ${githubSync.repo})`);

                        setSyncStatus(`⚠️ Admin access granted - GitHub sync unavailable: ${githubSync.unconfiguredReason()}. Use 🔄 to check or enter a token.`);
                        setTimeout(() => setSyncStatus(''), 8000);

            const handleChangePIN = () => {

                if (newPin.length < 4) { alert('PIN must be at least 4 digits'); return; }
                if (newPin !== confirmPin) { alert('PINs do not match'); return; }

                if (!confirmed) return;

                // decrypted with the default PIN as a fallback, so sync is not affected.

                setConfirmPin('');

            const handlePhotoUpload = async (event) => {
                const file = event.target.files[0];

                try {
                    setSyncStatus('📸 Processing photo...');
                    const resizedPhoto = await resizeImage(file);
                    setEditingFamily({...editingFamily, _pendingPhoto: resizedPhoto, _removePhoto: false});
                    setSyncStatus('✅ Photo added!');
